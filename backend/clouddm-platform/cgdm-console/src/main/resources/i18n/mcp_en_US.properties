# fields
MCP_F_DATA_SOURCE_ID_DESC=This field represents a `numeric ID`, which is Java's Long type. Each data source has a unique `numeric ID`. \
\n- Same function as `instance ID`, but different form:\
\n- The `numeric ID` grows with use, and the length of the string increases after carrying. \
\n- The `instance ID` is a fixed-length, identifiable string. \
\n- When displaying in a list, this field should be placed at the front for easy identification. If both `numeric ID` and `instance ID` are displayed, `instance ID` will be displayed first. \
\n- When passed in as a parameter, it needs to be distinguished from the `instance ID` to avoid confusion.
MCP_F_DATA_SOURCE_TYPE_DESC=Data source type, such as MySQL, PostgreSQL, Oracle, etc. Each data source has and has only one certain type. Different types of data sources differ in connection methods and query syntax. \
\n- When displayed in a list, this field should be placed first to highlight the data source type, usually after the data source ID. \
\n- When passed in as a parameter:\
\n- Please pay attention to spelling, the interface will be strictly verified. \
\n- Generally use the data source type parameter output by the previous interface. \
\n- If no upstream interface provides a data source type, you can obtain supported data source type information through the dsSettings tool and infer the specific data source type.
MCP_F_INSTANCE_ID_DESC=This field represents the `instance ID`, which is Java's String type. Each data source has a unique `instance ID`. The instance ID has a certain degree of identification, and usually its first few characters indicate the type of data source. \
\n- Same functionality as `numeric ID`, but different form:\
\n- The `instance ID` is a fixed-length, identifiable string. \
\n- `Number ID` is a pure number, and as usage grows, the length of the string will increase after carrying, while `Instance ID` will not have this situation. \
\n- When displaying in a list, this field should be placed at the front for easy identification. If both `numeric ID` and `instance ID` are displayed, `instance ID` will be displayed first. \
\n- When passed in as a parameter, it needs to be distinguished from the `numeric ID` to avoid confusion.
MCP_F_INSTANCE_ID_LIKE_DESC=This field is Java's String type, usually passed in by the user, and is used to represent the `instance ID` or part of it. \
\n- In general list queries: If the `numeric ID` of a data source can be unambiguously determined in combination with user input, the `numeric ID` parameter should be used in preference. Otherwise, this field can be used for fuzzy searches.
MCP_F_INSTANCE_DESC_LIKE_DESC=Java String type, passed in by the user, used to identify "instance remarks". Notes can be subsequently modified, unlike the Instance ID. Default comments may be repeated, so you need to pay attention to distinguish them or perform fuzzy matching when using them.
MCP_F_HOST_LIKE_DESC=Java String type, indicating the server address of the data source connection, which can be IP or domain name. Supports fuzzy search for list queries, matching all addresses containing the string.
MCP_F_LEVELS_DESC=Indicates the organizational level of the target database to be queried (numeric ID of the environment/numeric ID of the data source/library Catalog/schema/table). The parameter order requires that the names or IDs of each level be arranged in order from top to bottom. \
\n- Constraints: The input parameters at each level must come from the output of the previous level; names containing "/" are not supported, and a prompt or error should be reported when encountered. \
\n- Parameter example:\
\n - When getting the data source list, you need to pass in the numeric ID of the environment, for example: 1, \
\n - When getting the Schema list, you need to pass in the environment ID and data source numeric ID, such as 1 / 2\. Level information is defined in the form of a string array.
MCP_F_REFRESH_CACHE_DESC=Whether to refresh the cache, Java Boolean type.
MCP_F_LEAF_TYPE_DESC=Indicates the "endmost level" object type to be queried, and is used to limit the returned object list. Can be tables, external tables, views, materialized views, sequences, synonyms, stored procedures, stored functions, etc.; commonly used enumerations: Table, ExternalTable, View, Materialized, Sequence, Synonym. \
\n- The value is limited by the data source type; subject to leafExpand of the dsSettings interface. \
\n- Used with listLeaf to return only objects of the specified type.
MCP_F_LEAF_EXPAND_DESC=Indicates the list of supported types for objects that can be returned by this data source "end level". \
\n\- Purpose: used by listLeaf interface as optional type collection and verification basis. \
\n\- Source: Provided by dsSettings.leafExpand, varies with data source type. \
\n\- Examples: Table, ExternalTable, View, Materialized, Sequence, Synonym, etc.
MCP_F_QUERY_TYPE_DESC=Represents the type of query, Java’s String type. Value range: \
- RequestQuery represents a query operation that can execute arbitrary SQL statements, usually queries. \
- RequestPlan, use this statement when you need to view the query plan, because viewing the query plan of some data sources may not be completed through a SQL. In this mode, CloudDM can effectively solve this problem. Its underlying layer is specially optimized for query plan requests.
MCP_F_QUERY_STRING_DESC=SQL query command can be any legal query statement. It supports the execution of multiple statements. Statements are separated by semicolons. Some data sources may use other types of delimiters. For example, SQL SERVER will use GO. But in most cases the semicolon is the universal delimiter. \
\n- Note: Query statements containing commands for switching Schema/Catalog, such as USE database_name, are not supported; if necessary, another query is required and is determined by the levels parameter.
MCP_F_QUERY_FORCE_DESC=Whether to force query execution, Java Boolean type. Generally use false for the first query. \
\n- When the ruleCheckLevel field of the query return information is not PASS, the user needs to decide whether to ignore the prompt and continue execution. At this time, the parameter value should be true. \
\n- If the ruleCheckLevel value is SUGGEST, it means that you can also decide to continue execution by setting it to true. \
\n- If the value of ruleCheckLevel is FAILURE, there is no need to execute it anymore, and an error will be sent to the user to tell the user that there are no satisfied rules in ruleCheckList.
MCP_M_DBCHANGE_TICKETS=Query database change tickets by database name. The database name is matched bidirectionally against the pre-prod and prod side of the DB pair mapping (dm_db_pair), returning associated governance tickets (including ticket type, title, service, database list, SQL summary, execution status, promotion status). Suitable for DingTalk release flow to query when "this release contains database changes" is checked.
MCP_M_DBCHANGE_STATEMENTS=Query statement details and precheck results of a database change ticket by ticket ID. Returns per-database SQL content, precheck result JSON, execution status and details. Suitable for DingTalk approval flow to display ticket details.
MCP_M_DBCHANGE_RELEASE=Query production release detail by release ID. Returns release number, title, status, statement snapshots grouped by production database (with hash, execution status), and event timeline. Suitable for DingTalk approval flow to fetch complete release details.
MCP_F_DB_NAME_DESC=Database name, Java String type. Used to query change tickets by database name. The name matches both pre-prod and prod sides of the DB pair mapping (dm_db_pair pre_db_name or prod_db_name), so passing either the pre-prod or production database name will find associated tickets.
MCP_F_TICKET_TYPE_DESC=Ticket type, Java String type, optional values: PRE_DDL (pre-prod DDL ticket), PROD_DML (production DML ticket). If not provided, all types are returned.
MCP_F_EXECUTED_ONLY_DESC=Whether to return only executed tickets, Java Boolean type, default false. When true, only tickets with FINISHED status and all statement groups successfully executed are returned.
MCP_F_PAGE_DESC=Page number, Java int type, starting from 1, default 1.
MCP_F_SIZE_DESC=Page size, Java int type, default 20.
MCP_F_TICKET_ID_DESC=Ticket ID, Java Long type. Used to query statement details and precheck results for a specific ticket.
MCP_F_RELEASE_ID_DESC=Release ID, Java Long type. Used to query details of a specific release.
MCP_M_DBCHANGE_RELEASE_RETURN=External approval-flow release withdrawal (returns an APPROVING/APPROVED release to RETURNED). Either releaseNo or releaseId must be provided (releaseNo preferred from notification/detail), reason is mandatory. After return, source tickets are freed and can be re-merged into a new release or resubmitted in this release.
MCP_M_DBCHANGE_TICKET_APPROVE=External approval command: approve. Advances a WAIT_APPROVAL ticket to WAIT_CONFIRM (release also triggers handleApproved→APPROVED). Only applies to External orchestration channel tickets; command is truth — replays/out-of-order are rejected by status guards. approver/comment/externalFlowId optional, for activity log and audit trail.
MCP_M_DBCHANGE_TICKET_REJECT=External approval command: reject. Advances a WAIT_APPROVAL ticket to REJECTED terminal state (release also triggers handleRejected + deletes stmt rows). Only applies to External orchestration channel tickets; reject is terminal, no approval-stage return concept.
MCP_M_DBCHANGE_TICKET_CANCEL=External approval command: cancel. Advances a WAIT_APPROVAL ticket to CANCELED terminal state (release also triggers handleCancelled + deletes stmt rows). Only applies to External orchestration channel tickets; cancel is terminal.
MCP_M_DBCHANGE_TICKET_RETURN=External command: execution-failure return. Returns a ticket in EXEC_FAIL/WAIT_EXEC with FAILED groups to REVISION, awaiting applicant revision and resubmit. Tenant-level auth (AK/SK is the credential); cross-tenant returns not-found. IM notification sent to applicant on return.
MCP_M_DBCHANGE_TICKET_EXECUTE=External command: trigger execution. Advances a WAIT_CONFIRM ticket to WAIT_EXEC and starts the execution chain (ticket→createExecJob+startJob; release→startExecution). Only applies to External orchestration channel tickets. autoExecConfig derived per ticket type DML transaction semantics.
MCP_F_APPROVER_DESC=Approver name, Java String type, optional. Used for ticket activity log synthesis. When absent, no activity is synthesized; the command still executes normally.
MCP_F_COMMENT_DESC=Approval comment, Java String type, optional. Persisted in activity context for audit trail. When absent, no comment is recorded.
MCP_F_EXTERNAL_FLOW_ID_DESC=External engine flow identity, Java String type, optional. Persisted to the ticket approIdentity only when currently empty (never overwrites an existing value). Used for later ticket-detail display of the external approval flow identity.
MCP_F_REASON_DESC=Return reason, Java String type, optional. Recorded in the return event eventData and sent with the IM notification to the applicant.
MCP_M_DBCHANGE_TICKET_SUBMIT=External command: proxy ticket submit. Creates a governance ticket with a specified applicant account (precheck→create→WAIT_APPROVAL awaiting external command, or VIA_RELEASE enters the release ledger pool). ownerAccount is required; the resolved user must belong to the caller's tenant. Tenant-level auth (AK/SK is the credential).
MCP_M_DBCHANGE_TICKET_RESUBMIT=External command: proxy ticket resubmit. Resubmits a REVISION ticket with modified SQL (precheck runs as usual). For External-channel tickets, precheck-pass goes directly to WAIT_EXEC (bypasses approval surface; original approval record preserved). Tenant-level auth, skips owner-only check.
MCP_M_DBCHANGE_RELEASE_CREATE=External command: proxy release create. Merges multiple executed tickets' statement snapshots to create a production release (eligibility/gates/tenant-lock/uk fully reused). creatorAccount optional, defaults to service account. operator semantics per 09-14 (creatorUid=owner, operator only in event).
MCP_M_DBCHANGE_RELEASE_RESUBMIT=External command: proxy release resubmit. Resubmits a RETURNED release (re-merge tickets + rebuild approval surface). Skips creator/primary/maintainer permission check; tenant-level auth only. release.creatorUid unchanged; RELEASE_RESUBMITTED event operator = service account uid.
MCP_M_DBCHANGE_TICKET_DETAIL=Query ticket detail by ticketId. Returns ticket base info + approval/confirm/execution process list + activity list + event timeline. Desensitized: no AK/SK, no internal exception stacks, no console-specific permission flags. Cross-tenant returns not-found.
MCP_M_DBCHANGE_LEDGER_LIST=Query the change ledger list (ticket projection mergeable into production releases). Returns executed PRE_DDL tickets and VIA_RELEASE PROD_DML tickets in the release pool (with ticket number, type, execution status, SQL summary capped at 200 chars, pre/prod database lists, promoted flag, release number). Tenant-isolated: only the caller tenant's rows are returned; cross-tenant yields an empty list. Suitable for the DingTalk approval flow to pick ledger entries and convert them into a production release (path 1: ledger/list -> releases/create -> tickets/approve).
MCP_F_OWNER_ACCOUNT_DESC=Applicant platform account, Java String type, required. The ticket is created with this user as ownerUid (return/notification recipient = applicant). The resolved user's primaryUid must equal the caller's puid, otherwise not-found.
MCP_F_SERVICE_ID_DESC=Service ID, Java Long type, optional. Links to db_service table for ticket grouping by service.
MCP_F_GROUPS_DESC=Statement group list, Java List type, required. Each group contains pairId (db pair ID) and sqlContent (SQL statement text).
MCP_F_TICKET_TITLE_DESC=Ticket title, Java String type, required. Used for ticket list and detail display.
MCP_F_DESCRIPTION_DESC=Ticket description, Java String type, optional. Supplementary information.
MCP_F_APPROVAL_MODE_DESC=Approval mode, Java String type, optional. DIRECT (default) = direct approval+execution; VIA_RELEASE = enter release ledger pool (PROD_DML only).
MCP_F_PAIR_ID_DESC=Database pair ID, Java Long type, required. The dm_db_pair numeric ID specifying the pre/prod database mapping.
MCP_F_SQL_CONTENT_DESC=SQL statement content, Java String type, required. Multiple statements separated by semicolons.
MCP_F_GROUP_ID_DESC=Statement group ID, Java Long type, required. The dm_ticket_db_stmt numeric ID identifying the FAILED group to modify on resubmit.
MCP_F_ROLLBACK_SQL_DESC=Rollback SQL, Java String type, optional. Applicant-provided rollback SQL. When blank, a backup template is generated by the system.
MCP_F_TICKET_IDS_DESC=Ticket ID list, Java List<Long> type, required. Source ticket list for release merge creation.
MCP_F_CREATOR_ACCOUNT_DESC=Creator platform account, Java String type, optional. Defaults to the service account itself. The resolved user's primaryUid must equal the caller's puid.
MCP_F_TITLE_DESC=Title, Java String type, optional. Release title; auto-generated when omitted.
MCP_F_SKIP_OUTBOUND_DESC=Skip outbound initiation, Java Boolean type, optional, defaults to false. true = do NOT call the bridge flows/create after the release is created — path-1 (bridge converts ledger entries into a release AFTER the DingTalk approval already completed) MUST carry true to avoid spawning a duplicate DingTalk approval instance; console-page creation must not set it.
MCP_F_PROMOTED_DESC=Promoted filter, Java Boolean type, optional. true = only rows already merged into a release; false = only rows not yet merged (selectable candidates); omitted = no filtering.
