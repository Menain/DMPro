APPROVAL_SQL_FILE_MAX_MB=SQL 工单上传文件最大大小（MB）
APPROVAL_DML_EXPLAIN_MAX_STATEMENTS=单个工单 DML EXPLAIN 最大分析语句数量
APPROVAL_DML_EXPLAIN_MAX_STATEMENT_MB=单条 DML EXPLAIN 最大语句大小（MB）
HIDE_STANDARD_TICKET_ENTRY=隐藏普通工单入口（仅治理工单模式）
TENCENT_CLOUD_SECRET_ID=腾讯云 SecretId
TENCENT_CLOUD_SECRET_KEY=腾讯云 SecretKey
USER_GH_OST_SIZE_THRESHOLD_MB=无锁结构变更(gh-ost)表大小触发阈值(MB)——单条 ALTER 目标表达到该值时自动以 gh-ost 无锁方式执行
USER_GH_OST_ROW_THRESHOLD=无锁结构变更(gh-ost)行数触发阈值——单条 ALTER 目标表达到该值时自动以 gh-ost 无锁方式执行
USER_GH_OST_DEFAULT_OPTIONS=无锁变更(gh-ost)管理员默认参数——13 个任务级参数的 JSON 对象(如 {"chunkSize":2000})；留空则使用插件编译期默认值
USER_GHOST_AUTO_ROUTE=无锁变更自动路由开关——开启后，超过阈值的单条 ALTER 预发工单组自动以 gh-ost 无锁方式执行；关闭则全量回退直接执行(止血开关)
USER_ALERT_PUSH_ENABLE=异常告警推送开关——开启后，平台告警场景(如大表变更无法无锁执行)推送到本租户配置的 IM 群机器人；关闭则全部静默不发
USER_DML_ROW_THRESHOLD=无锁数据变更行数触发阈值——单条 UPDATE/DELETE 的 EXPLAIN 预估影响行数(估算不可得时按目标表行数)达到该值时，自动以分批限流方式执行
USER_DML_BATCH_SIZE=无锁数据变更单批行数——每批最多修改的行数(组织规范 §9.8.2 建议 ≤5000；下限 1000 防止批间往返开销主导)
USER_DML_BATCH_INTERVAL_MS=无锁数据变更批间隔(毫秒)——两批之间的限流旋钮；每批独立提交，间隔约束写入压力与主从延迟
USER_DML_LAG_THRESHOLD_SEC=无锁数据变更主从延迟阈值(秒)——实测复制延迟高于该值时批执行让位暂停，低于阈值一半才恢复(组织规范 §9.8.2：延迟 >10 秒暂停评估)
USER_DML_BATCH_TIMEOUT_SEC=无锁数据变更单批超时(秒)——单批语句(边界 SELECT + 批 DML)的控制台侧硬超时预算；默认对齐工单 task 档 300 秒
USER_DML_BATCH_AUTO_ROUTE=无锁数据变更自动路由开关——开启后，PROD_DML/PRE_DDL 工单组中超过阈值的单表 UPDATE/DELETE 自动以分批限流方式执行；关闭则全量回退直接执行(止血开关；在途批任务跑完)
USER_DING_BRIDGE_BASE_URL=钉钉审批桥接服务地址(如 http://bridge-host:8080)——留空则跳过全部出站发起
USER_DING_BRIDGE_AUTH_TOKEN=钉钉审批桥接鉴权令牌——出站 flows/create 与 flows/cancel 调用以 X-Bridge-Auth 请求头携带
USER_DING_BRIDGE_TIMEOUT_MS=钉钉桥接出站读超时(毫秒)——连接超时固定 3 秒；约束单次 flows/create 或 flows/cancel 调用
USER_DING_BRIDGE_OUTBOUND_ENABLE=钉钉桥接出站开关——开启后，External 通道工单提交/发布单创建在事务提交后经桥接服务发起钉钉审批流程，本地撤销/关闭时出站通知桥接撤销实例；关闭则回退纯拉模式(止血开关；入站开放命令面不受影响)
USER_GOV_EXTERNAL_COMMAND_STRICT_FLOW=外部命令严格 flow 绑定档(ADR-012 预留,默认关闭)——开启后,审批三态命令(approve/reject/cancel)缺失 externalFlowId 或 externalRound 即被拒绝(FLOW_ID_MISSING/ROUND_MISSING);关闭(默认,读取失败同样按关闭)为宽松档:缺失字段跳过一致性校验,不匹配(FLOW_ID_MISMATCH/ROUND_MISMATCH)的拒绝不受本开关影响、恒生效。开启前必须先完成桥接升级联调实证(冻结契约「最简调用只传 ticketId」)
USER_GOV_SCHEMA_PRECHECK_FAIL_CLOSED=发布结构预检 fail-closed 开关——开启(默认)时，预检无法证明生产结构安全(基础设施故障、SQL 不可解析、输入缺失)即拒绝派发(语句置 FAILED，修复后重试)；关闭为平台级止血，回退旧「告警后放行」行为。已确认违规无论开关始终拦截
USER_GOV_SCHEMA_DIFF_FAIL_CLOSED=发布结构漂移比对 fail-closed 开关——开启(默认)时，比对无法证明生产结构安全(活体结构拉取失败、新发布单缺快照)即拒绝派发(语句置 FAILED，修复后重试)；关闭为平台级止血，回退旧「告警后放行」行为。已确认漂移无论开关始终拦截
